<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">RepoContract workflow overview</title>
<desc id="desc">Architecture rules, connected to actual imports. Set a boundary: Routes must not import the database.. Resolve dependencies: Parse imports with TypeScript.. Point to the violation: Rule, file, import, and source line.</desc>
